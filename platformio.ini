[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
board_build.partitions = default.csv
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
    bblanchon/ArduinoJson@^6.21.5

[env:esp32-c3-devkitm-1-ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = esp32-c3-test.local
upload_flags =
    --auth=${sysenv.ESP32_OTA_PASSWORD}
; Pass the device IP or OTA hostname at upload time with --upload-port.
; Set ESP32_OTA_PASSWORD in your shell before running an OTA upload.
